name: Deploy to GitHub Pages

# Pages hosts the static marketing site only. The management app (apps/management)
# is a Next.js/Prisma server app and cannot be served from Pages, so this builds
# apps/web alone rather than the root `build` script, which builds both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # There is no lockfile at the repo root; each app carries its own.
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build:web
        # Vite bakes these in at build time. Unset, the site's forms and portal
        # links fall back to localhost — see apps/web/.env.example.
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MANAGEMENT_URL: ${{ secrets.VITE_MANAGEMENT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
